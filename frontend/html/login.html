<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang chủ</title>
    <link rel="icon" href="../../images/favicon.ico">
    <link href="../css/style.css" rel="stylesheet">
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
    <script type="text/javascript" src="../js/script.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
<header>
    <a id ="logo" href="main.html"><img src="../../images/logo.png" alt="Freeze" title="Freeze"></a>
    <img id ="header-img-1" src="../../images/css/header-img1.png">
    <img id ="header-img-2" src="../../images/css/header-img2.png">
    <img id ="header-img-3" src="../../images/css/header-img3.png">

    <nav id="forward-tab">
        <a class="forward" href="main.html">Trang chủ</a>
        <a class="forward" href="introduce.html">Giới thiệu</a>
        <a class="forward" href="product.html">Sản phẩm</a>
        <a class="forward" href="news.html">Tin tức</a>
        <a class="forward" href="login.html">Đăng nhập</a>
        <a class="forward" href="register.html">Đăng ký</a>
        <a class="forward" href="contact.html">Liên hệ</a>
    </nav>

    <div id="search-area">
        <form id="search-form" action="tim_kiem.html" method="get">
            <input type ="text" id ="search" name="search" placeholder="Yaourd dâu...">
            <button type="submit" id="button-search" class="button-shopping">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
          <a href="donhang.html">
                <button type="button" id="button-cart" class="button-shopping"> 
                <i class="fa-solid fa-cart-shopping"></i>
                </button>
            </a>
        </form>
    </div>
</header>
<main>
    <article>
        <form id="form-login" action ="tim_kiem.html" method="post" enctype="application/x-www-form-urlencoded">
            <fieldset>
                <legend><b>Đăng nhập</b></legend>
                <table>

                    <thead>
                        <tr>
                            <td align="center" colspan="2">
                                <img src="../../images/dangnhap/userlogin.png" alt="user" title="User" width="20%" height="20%">
                            </td>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <th  align="left">
                                <label for="email">Email</label>
                            </th>
                            <td>
                                <input type ="email" name="email" id="email" placeholder="Vui lòng nhập email">
                            </td>
                        </tr>

                        <tr>
                            <th  align="left" rowspan="2">
                                <label for="pass">Mật khẩu</label>
                            </th>
                            <td>
                                <input type ="password" name="pass" id="pass" placeholder="Vui lòng nhập mật khẩu">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <button
                                        id="btn-login"
                                        type="submit">Đăng nhập</button>
                                <input type="reset" value="Hủy">
                            </td>

                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="2">
                                <p>
                                    <b>
                                        Bạn quên
                                        <a href="" target="_blank">Mật khẩu?</a>
                                        <input type="checkbox" name="remember" id="remember" value="1">
                                        <label for="remember">Ghi nhớ cho lần đăng nhập sau</label>
                                    </b>
                                </p>
                            </td>
                        </tr>
                    </tfoot>

                </table>
            </fieldset>
        </form>
    </article>
</main>
<footer>
    <p>
        <b>
            &copy 2021 Bản quyền thuộc về FreeezeVN.
            <a class="sponsor-icon" href="https://www.facebook.com/conbotmanhnhatlichsu/?locale=vi_VN" target ="_seft">
                <i class="fa-brands fa-facebook-f"></i>
            </a>
            <a class="sponsor-icon" href="https://x.com/haihuocvabadao" target ="_seft">
                <i class="fa-brands fa-twitter"></i>
            </a>
            <a class="sponsor-icon" href="https://www.pinterest.com/phamthinhung10111973/s%E1%BB%AFa-chua/" target ="_seft">
                <i class="fa-brands fa-pinterest"></i>
            </a>
        </b>
        <a href="#logo" >
            <img  id="logo-footer" src="../../images/css/top.png" alt="Logo" title="Logo" loading="lazy"/>
        </a>
    </p>
</footer>
</body>
</html>
