<main>
    <article>
        <form action="" method="post" enctype="multipart/form-data">
            <fieldset width="50">
                <legend><b>ĐĂNG KÝ</b></legend>
                <table>
                    <tr align="left">
                        <th scope="row">
                            <label for="email">Email</label>
                        </th>
                        <td>
                            <input type="email" name="email" id="email" placeholder="Vui lòng nhập mail!">
                        </td>
                    </tr>

                    <tr align="left">
                        <th  scope="row">
                            <label for="pass">Mật khẩu</label>
                        </th>
                        <td>
                            <input type="password" name="pass" id="pass" placeholder="Vui lòng nhập mật khẩu">
                        </td>
                    </tr>

                    <tr align="left">
                        <th  scope="row">
                            <label for="re_pass">Nhập lại mật khẩu</label>
                        </th>
                        <td>
                            <input type="password" name="re_pass" id="re_pass" placeholder="Vui lòng nhập mật khẩu">
                        </td>
                    </tr>

                    <tr align="left">
                        <th  scope="row">Cấp độ thành viên</th>
                        <td>
                            <input type="radio" name="level" id="bac" value="0">
                            <label for="bac"><b>Bạc</b></label>
                            <input type="radio" name="level" id="vang" value="1">
                            <label for="vang"><b>Vàng</b></label>
                            <input type="radio" name="level" id="bachkim" value="2">
                            <label for="bachkim"><b>Bạch kim</b></label>
                        </td>
                    </tr>

                    <tr align="left">
                        <th  scope="row" width="150">Ảnh đại diện</th>
                        <td>
                            <input type="file" name="file" id="file">
                        </td>
                    </tr>

                </table>

                <p>
                    <b>
                    Thông qua việc tạo tài khoản, bạn đồng ý với
                    <a href="https://tuyensinhso.vn/ban-tin/trac-nghiem-mon-phap-luat-dai-cuong-co-dap-an-c357513.html" target ="_blank" >Điều khoản</a>
                    &
                    <a href="https://tuyensinhso.vn/ban-tin/trac-nghiem-mon-phap-luat-dai-cuong-co-dap-an-c357513.html" target ="_blank" >Quyền riêng tư của chúng tôi</a>
                    </b>
                </p>

                <button type="reset"  name="reset" >Hủy</button>
                <button type="submit">Đăng ký</button>
            </fieldset>
        </form>
    </article>
</main>
