<main>
    <h1>
        CHI TIẾT ĐƠN HÀNG
    </h1>
    <table border=1px id="bang-don-hang">
        <thead>
            <tr>
                <th>Hình SP</th>
                <th>Tên SP</th>
                <th>Số lượng</th>
                <th>Giá</th>
                <th>Thành Tiền</th>
                <th></th>
            </tr>
        </thead>

        <!-- JavaScript sẽ tự động chèn các dòng sản phẩm vào đây -->
        <tbody id="danh-sach-sp"></tbody>

        <!-- Phần tổng kết tiền tự động cập nhật -->
        <tfoot>
            <tr>
                <td colspan="6" style="text-align: right;">Tổng thành tiền (A) = <span id="tong-a">0 đ</span></td>
            </tr>
            <tr>
                <td colspan="6" style="text-align: right;">Chiết Khấu (B) = 0.1 x A = <span id="chiet-khau-b">0 đ</span></td>
            </tr>
            <tr>
                <td colspan="6" style="text-align: right;">Thuế (C) = 10% x (A - B) = <span id="thue-c">0 đ</span></td>
            </tr>
            <tr>
                <td colspan="6" style="text-align: right;">Tổng đơn hàng = A - B + C = <span id="tong-don-hang">0 đ</span></td>
            </tr>
            <tr>
                <td colspan="6" style="text-align: center;">
                    <button onclick="xacNhanDonHang()">Xác Nhận Đơn Hàng</button>
                </td>
            </tr>
        </tfoot>
    </table>
</main>
