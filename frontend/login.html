<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang chủ</title>
    <link rel="icon" href="../images/favicon.ico">
    <meta name="viewport" content="device-width, initial-scale=1.0">
</head>
<body>
<header>
    <a id ="head" href="main.html"><img src="../images/logo.png" alt="Freeze" title="Freeze"></a>
    <nav>
        <a href="main.html" target="_seft">Trang chủ</a>
        <a href="introduce.html"target="_seft">Giới thiệu</a>
        <a href="product.html" target="_seft">Sản phẩm</a>
        <a href="news.html" target="_seft">Tin tức</a>
        <a href="login.html" target="_seft">Đăng nhập</a>
        <a href="register.html" target="_seft">Đăng ký</a>
        <a href="contact.html" target="_seft">Liên hệ</a>
    </nav>
</header>
<main>
    <article>
        <form action ="" method=post enctype="application/x-www-form-urlencoded">
            <fieldset>
                <legend><b>Đăng nhập</b></legend>
                <table>

                    <thead>
                        <tr>
                            <td align="center" colspan="2">
                                <img src="../images/dangnhap/userlogin.png" alt="user" title="User" width="20%" height="20%">
                            </td>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <th  align="left">
                                <label for="email">Email</label>
                            </th>
                            <td>
                                <input type ="email" name="email" id="email" placeholder="Vui lòng nhập email">
                            </td>
                        </tr>

                        <tr>
                            <th  align="left" rowspan="2">
                                <label for="pass">Mật khẩu</label>
                            </th>
                            <td>
                                <input type ="password" name="pass" id="pass" placeholder="Vui lòng nhập mật khẩu">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <button type="submit">Đăng nhập</button>
                                <input type="reset" value="Hủy">
                            </td>

                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="2">
                                <p>
                                    <b>
                                        Bạn quên
                                        <a href="" target="_blank">Mật khẩu?</a>
                                        <input type="checkbox" name="remember" id="remember" value="1">
                                        <label for="remember">Ghi nhớ cho lần đăng nhập sau</label>
                                    </b>
                                </p>
                            </td>
                        </tr>
                    </tfoot>

                </table>
            </fieldset>
        </form>
    </article>
</main>
<footer>

    </p>
</footer>
</body>
</html>
